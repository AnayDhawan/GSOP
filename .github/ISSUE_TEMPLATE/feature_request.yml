name: Feature request
description: Suggest a change to the site
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The need, not the solution
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        The site reads stored results and never recomputes a score, so requests for new scoring or new simulation runs belong in the simulation repository, not here.
